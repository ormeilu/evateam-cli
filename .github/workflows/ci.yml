name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.83.0
          cache: true
      - run: pixi run test
      - run: pixi run e2e
      - name: Unit and e2e tests under AddressSanitizer
        run: pixi run asan
      - uses: actions/upload-artifact@v7
        with:
          name: eva-${{ runner.os }}-${{ runner.arch }}
          path: build/eva

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.83.0
          cache: true
      - run: pixi run build
      - run: pixi run coverage
      - name: Summary
        run: |
          {
            echo '### Line coverage of src/'
            echo '```'
            cat coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage/summary.txt
            coverage/missed-lines.txt
