name: release

# release-please keeps a release PR open on main, built from conventional
# commits (feat:, fix:). Merging it tags vX.Y.Z and creates the GitHub release;
# the jobs below then build wheels, conda packages and archives for three
# platforms, test each one installed the way a user would, and publish them:
# wheels to PyPI, conda packages to prefix.dev/ormeilu/ormeilu, archives to the
# GitHub release.
#
# Everything sits in this one workflow: a tag pushed with GITHUB_TOKEN does not
# start other workflows, and the PyPI and prefix.dev trusted publishers name
# this file. A manual run builds and tests without publishing; pushing a tag by
# hand publishes that tag.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  plan:
    needs: release-please
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.p.outputs.build }}
      publish: ${{ steps.p.outputs.publish }}
      tag: ${{ steps.p.outputs.tag }}
      ref: ${{ steps.p.outputs.ref }}
    steps:
      - id: p
        env:
          RP_CREATED: ${{ needs.release-please.outputs.created }}
          RP_TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          if [ "$RP_CREATED" = "true" ]; then
            echo "build=true publish=true tag=$RP_TAG ref=$RP_TAG" | tr ' ' '\n' >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "build=true publish=true tag=$GITHUB_REF_NAME ref=$GITHUB_REF" | tr ' ' '\n' >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "build=true publish=false tag= ref=$GITHUB_REF" | tr ' ' '\n' >> "$GITHUB_OUTPUT"
          else
            echo "build=false publish=false tag= ref=" | tr ' ' '\n' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.build == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            wheel: macosx_13_0_arm64
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            wheel: manylinux_2_34_x86_64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            wheel: manylinux_2_34_aarch64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.83.0
          cache: true
      - name: Check the tag matches the version
        if: needs.plan.outputs.tag != ''
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          v=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' pixi.toml | head -1)
          [ "$TAG" = "v$v" ] || { echo "tag $TAG != pixi.toml $v"; exit 1; }
          grep -q "comptime VERSION = \"$v\"" src/main.mojo || { echo "src/main.mojo VERSION != $v"; exit 1; }
          grep -qE "^  version: \"?$v\"?\$" recipe/recipe.yaml || { echo "recipe/recipe.yaml version != $v"; exit 1; }
      - run: pixi run wheel ${{ matrix.wheel }}
      - run: pixi run archive ${{ matrix.target }}
      - name: Check glibc symbols fit the manylinux tag
        if: runner.os == 'Linux'
        run: |
          max=$(objdump -T build/eva | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)
          echo "highest: $max"
          [ "$(printf '%s\nGLIBC_2.34\n' "$max" | sort -V | tail -1)" = "GLIBC_2.34" ]
      - uses: astral-sh/setup-uv@v10.3.3
      - name: End-to-end test of the installed wheel
        run: |
          uv venv -q --python 3.12 /tmp/eva-venv
          uv pip install -q --python /tmp/eva-venv/bin/python dist/*.whl
          # Outside the pixi environment, as a user would run it.
          env -i HOME="$HOME" PATH=/tmp/eva-venv/bin:/usr/bin:/bin EVA_BIN=/tmp/eva-venv/bin/eva \
            bash tests/e2e.sh
      - name: Install the archive with install.sh and run the suite
        run: |
          # The archive brings its own libraries; Python comes from PATH.
          env -i HOME=/tmp/eva-home PATH=/tmp/eva-venv/bin:/usr/bin:/bin \
            EVA_ARCHIVE="$(ls dist/eva-*.tar.gz)" sh install.sh
          env -i HOME=/tmp/eva-home PATH=/tmp/eva-venv/bin:/usr/bin:/bin \
            EVA_BIN=/tmp/eva-home/.local/bin/eva bash tests/e2e.sh
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.sha256

  conda:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.build == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.83.0
          run-install: false
      # The recipe's own test runs `eva --version` and `eva --help`.
      - run: >-
          pixi exec rattler-build build --recipe recipe/recipe.yaml --output-dir output
          -c https://conda.modular.com/max -c https://prefix.dev/modular-community -c conda-forge
      - name: Install with pixi global from the built package and run the suite
        run: |
          export PIXI_HOME=/tmp/pixihome
          pixi global install -c "file://$PWD/output" -c https://conda.modular.com/max \
            -c conda-forge evateam-cli
          python3 -m venv /tmp/mock-venv
          env -i HOME="$HOME" PATH=/tmp/pixihome/bin:/tmp/mock-venv/bin:/usr/bin:/bin \
            EVA_BIN=/tmp/pixihome/bin/eva bash tests/e2e.sh
      - uses: actions/upload-artifact@v7
        with:
          name: conda-${{ matrix.os }}
          path: output/*/*.conda

  publish-pypi:
    needs: [plan, build, conda]
    if: ${{ !cancelled() && needs.plan.outputs.publish == 'true' && needs.build.result == 'success' && needs.conda.result == 'success' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: rm -f dist/*.tar.gz dist/*.sha256
      - uses: pypa/gh-action-pypi-publish@v1.14.3

  publish-conda:
    needs: [plan, build, conda]
    if: ${{ !cancelled() && needs.plan.outputs.publish == 'true' && needs.build.result == 'success' && needs.conda.result == 'success' }}
    runs-on: ubuntu-latest
    environment: prefix
    permissions:
      id-token: write
    steps:
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.83.0
          run-install: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: conda-*
          path: output
          merge-multiple: true
      # Trusted publishing: rattler-build trades the GitHub OIDC token for a
      # prefix.dev upload token, so no API key is stored in the repo.
      - run: pixi exec rattler-build upload prefix --channel ormeilu/ormeilu output/*/*.conda

  publish-github:
    needs: [plan, build, conda]
    if: ${{ !cancelled() && needs.plan.outputs.publish == 'true' && needs.build.result == 'success' && needs.conda.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      # Only the archives: a wheel matches the same os/arch words, and mise's
      # github backend would pick it over the archive. Wheels live on PyPI.
      - name: Attach archives to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          # release-please created the release; a hand-pushed tag has none yet.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --repo "$GITHUB_REPOSITORY" --clobber
