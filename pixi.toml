[workspace]
name = "eva-cli"
version = "0.5.1"
description = "EvaTeam from the command line, written in Mojo"
authors = ["Ilya Lubenets"]
channels = ["https://conda.modular.com/max", "https://prefix.dev/modular-community", "conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
license = "MIT"

[dependencies]
mojo = "==1.2.0"
mist = ">=26.3.0,<27"
openssl = ">=3,<4"
# Only for the packaging scripts and the e2e mock server; eva itself uses no Python.
python = ">=3.12,<3.14"

# Modular's runtime needs GLIBCXX_3.4.30 (GCC 12+); releases ship these next to
# eva, since RHEL 9 and its clones have an older libstdc++.
[target.linux-64.dependencies]
patchelf = "*"
libstdcxx = ">=12"
libgcc = ">=12"

[target.linux-aarch64.dependencies]
patchelf = "*"
libstdcxx = ">=12"
libgcc = ">=12"

# mojo build targets the build machine's CPU and OS by default. Releases pin
# both to Modular's own floor, so a binary built on a new runner still runs on
# the oldest machine Mojo supports: Apple M1 and macOS 13, x86-64-v3, Neoverse N1.
# On macOS the triple and MACOSX_DEPLOYMENT_TARGET are both needed for the
# minimum OS to stick.
[target.osx-arm64.tasks]
build = { cmd = "mkdir -p build && mojo build --target-triple arm64-apple-macosx13.0 --target-cpu apple-m1 -I src src/main.mojo -o build/eva", env = { MACOSX_DEPLOYMENT_TARGET = "13.0" }, description = "Build the eva binary (macOS 13+, Apple M1+)" }

[target.linux-64.tasks]
build = { cmd = "mkdir -p build && mojo build --target-cpu x86-64-v3 -I src src/main.mojo -o build/eva", description = "Build the eva binary (x86-64-v3)" }

[target.linux-aarch64.tasks]
build = { cmd = "mkdir -p build && mojo build --target-cpu neoverse-n1 -I src src/main.mojo -o build/eva", description = "Build the eva binary (Neoverse N1+)" }

[tasks]
build = { cmd = "mkdir -p build && mojo build -I src src/main.mojo -o build/eva", description = "Build the eva binary" }
run = { cmd = "mojo run -I src src/main.mojo", description = "Run without building" }
test = { cmd = "bash tests/run_unit.sh", description = "Run the unit tests (zero warnings allowed)" }
e2e = { cmd = "bash tests/e2e.sh", depends-on = ["build"], description = "Run the binary against a mock server" }
wheel = { cmd = "python scripts/build_wheel.py", depends-on = ["build"], description = "Pack build/eva into a wheel: pixi run wheel PLATFORM_TAG" }
conda-package = { cmd = "rattler-build build --recipe recipe/recipe.yaml --output-dir output -c https://conda.modular.com/max -c https://prefix.dev/modular-community -c conda-forge", description = "Build the conda package into output/" }
archive = { cmd = "python scripts/build_archive.py", depends-on = ["build"], description = "Pack a release archive: pixi run archive TARGET" }
coverage = { cmd = "bash scripts/coverage.sh", description = "Line coverage of src/ by unit and e2e tests (coverage/index.html)" }
asan = { cmd = "bash scripts/asan.sh", description = "Unit and e2e tests under AddressSanitizer" }
fmt = { cmd = "mojo format src tests", description = "Format sources" }
