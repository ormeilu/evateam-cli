[workspace]
name = "eva-cli"
version = "0.3.0"
description = "EvaTeam from the command line, written in Mojo"
authors = ["Ilya Lubenets"]
channels = ["https://conda.modular.com/max", "https://prefix.dev/modular-community", "conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
license = "MIT"

[dependencies]
mojo = "==1.2.0"
emberjson = ">=0.4.0,<0.5"
mist = ">=26.3.0,<27"
openssl = ">=3,<4"
python = ">=3.12,<3.14"

[target.linux-64.dependencies]
patchelf = "*"

[target.linux-aarch64.dependencies]
patchelf = "*"

# Without both the triple and the deployment target, mojo stamps the binary with
# the build machine's macOS as its minimum, and it will not start on older ones.
[target.osx-arm64.tasks]
build = { cmd = "mkdir -p build && mojo build --target-triple arm64-apple-macosx13.0 -I src src/main.mojo -o build/eva", env = { MACOSX_DEPLOYMENT_TARGET = "13.0" }, description = "Build the eva binary (macOS 13+)" }

[tasks]
build = { cmd = "mkdir -p build && mojo build -I src src/main.mojo -o build/eva", description = "Build the eva binary" }
run = { cmd = "mojo run -I src src/main.mojo", description = "Run without building" }
test = { cmd = "mojo run -I src tests/test_all.mojo", description = "Run unit tests" }
e2e = { cmd = "bash tests/e2e.sh", depends-on = ["build"], description = "Run the binary against a mock server" }
wheel = { cmd = "python scripts/build_wheel.py", depends-on = ["build"], description = "Pack build/eva into a wheel: pixi run wheel PLATFORM_TAG" }
conda-package = { cmd = "rattler-build build --recipe recipe/recipe.yaml --output-dir output -c https://conda.modular.com/max -c https://prefix.dev/modular-community -c conda-forge", description = "Build the conda package into output/" }
archive = { cmd = "python scripts/build_archive.py", depends-on = ["build"], description = "Pack a release archive: pixi run archive TARGET" }
fmt = { cmd = "mojo format src tests", description = "Format sources" }
